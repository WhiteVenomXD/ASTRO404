<style>
:root{--bg:#e8ebf7;--fg:#141830;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.s{display:block;width:100%;margin:8px 0;padding:12px 14px;background:#141a33;border:1px solid #2c3872;border-radius:16px;color:#e8ecff;font:900 15px "Space Grotesk","Exo 2",system-ui;text-align:left;cursor:pointer}
.s:hover,.s:focus-visible{border-color:#00e5ff;outline:none}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sg .s{margin:0}
.s small{color:#9aa6d8;font-weight:900}
.s em{color:#ffd24d;font-style:normal}
.s i{float:right;font-style:normal;color:#4dffb0;font-size:12px}
.d{opacity:.45}
.sub{margin:2px 0 8px;color:#9aa6d8;letter-spacing:2px;font-size:13px}
.pl{display:flex;gap:8px;justify-content:center;margin:10px 0}
.pl span{background:#141a33;border:1px solid #2c3872;border-radius:20px;padding:6px 12px}
.tb{display:flex;gap:6px;margin:16px 0 10px}
.tb button{flex:1;padding:10px 2px;background:#141a33;border:1px solid #2c3872;border-radius:14px;color:#9aa6d8;font:900 13px "Space Grotesk","Exo 2",system-ui;cursor:pointer}
.tb .on{background:#1d2a5c;border-color:#00e5ff;color:#fff}
.w{border-left-width:6px}
.cs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cs button{aspect-ratio:1;border-radius:50%;border:3px solid transparent;cursor:pointer;font:900 12px "Space Grotesk","Exo 2",system-ui;color:#04101a;padding:0}
.cs .on{border-color:#fff;box-shadow:0 0 14px #fff}
.s.on{border-color:#00e5ff;background:#1d2a5c}
.b,.s,.tb button{transition:transform .12s,box-shadow .12s,filter .12s,border-color .12s}
.b:hover{transform:translateY(-2px) scale(1.04);filter:brightness(1.15)}
.b:active{transform:scale(.92)!important;filter:brightness(1.4);box-shadow:0 0 6px rgba(0,229,255,.9)}
.s:hover{transform:translateX(3px)}.s:active,.tb button:active,.cs button:active{transform:scale(.94)}
.tb{flex-wrap:wrap}.tb button{flex:1 1 22%}
.pk{position:absolute;z-index:2;border:2px solid #2c3872;background:#141a33cc;color:#fff;border-radius:50%;width:46px;height:46px;font:900 20px "Space Grotesk","Exo 2",system-ui;cursor:pointer;display:none;padding:0}
.pk:active{transform:scale(.88)}#pb{top:34px;right:10px;width:42px;height:42px;border-radius:13px;border:1.5px solid rgba(0,229,255,.75);background:linear-gradient(145deg,rgba(0,229,255,.22),rgba(123,92,255,.3));box-shadow:0 0 14px rgba(0,229,255,.35),inset 0 0 10px rgba(0,229,255,.18);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:transform .12s,box-shadow .12s,filter .12s}#pb svg{width:18px;height:18px;display:block;margin:auto;fill:#eaf9ff;filter:drop-shadow(0 0 4px #00e5ff)}#pb:hover{filter:brightness(1.25);box-shadow:0 0 20px rgba(0,229,255,.6),inset 0 0 12px rgba(0,229,255,.3)}#pb:active{transform:scale(.88);box-shadow:0 0 8px rgba(0,229,255,.9)}#ab{bottom:18px;right:14px;width:66px;height:66px;border-color:#00e5ff;font-size:22px}
h1,h2{font-family:Orbitron,"Exo 2",system-ui,sans-serif}
h1{font-size:clamp(24px,8vw,40px);letter-spacing:3px;background-image:linear-gradient(90deg,#00e5ff,#ff3d8b,#00e5ff);background-size:200% 100%;animation:sh 6s linear infinite,gl 7s infinite}
@keyframes sh{to{background-position:200% 0}}
@keyframes gl{0%,86%,100%{transform:none;filter:drop-shadow(0 0 14px rgba(0,229,255,.45))}88%{transform:translate(-4px,1px) skewX(-10deg);filter:drop-shadow(-5px 0 #ff3d8b) drop-shadow(5px 0 #00e5ff)}90%{transform:translate(4px,-1px) skewX(8deg);filter:drop-shadow(5px 0 #ff3d8b) drop-shadow(-5px 0 #00e5ff)}92%{transform:translate(-2px,0);filter:drop-shadow(0 0 4px #fff)}94%{transform:scale(1.06);filter:drop-shadow(0 0 28px #00e5ff) brightness(1.7)}97%{transform:none;filter:drop-shadow(0 0 14px rgba(0,229,255,.45))}}
@media(prefers-reduced-motion:reduce){h1{animation:none}}

te(1.5 2.5)' fill='rgba(0,0,0,.35)' stroke='rgba(0,0,0,.35)' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M4 4L23.5 11.6L13.7 14.8L10.5 23.4Z' fill='%23050818' stroke='%23050818' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M4 4L23.5 11.6L13.7 14.8L10.5 23.4Z' fill='url(%23f)' stroke='url(%23n)' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M5.6 5.8L19.3 11.2L13.4 13.2Z' fill='url(%23h)'/%3E%3C/svg%3E")}

.wg{display:flex;gap:6px}.wg .s{margin:0}.wg .s:first-child{flex:1}.wg .s:nth-child(2){width:96px;flex:none}


/* ---- Campo de entrenamiento ---- */
.bs .bt .trb{--w:var(--wc,var(--bc));position:relative;overflow:hidden;display:flex;align-items:center;gap:9px;width:100%;box-sizing:border-box;margin-top:10px;padding:4px 5px 4px 4px;border-radius:999px;border:1px solid color-mix(in srgb,var(--w) 80%,#fff);background:linear-gradient(100deg,color-mix(in srgb,var(--w) 55%,#06091c),color-mix(in srgb,var(--w) 20%,#06091c));color:#fff;font:900 11px/1.1 Orbitron,"Exo 2",system-ui,sans-serif;letter-spacing:1.2px;text-transform:uppercase;text-align:left;cursor:pointer;touch-action:manipulation;box-shadow:0 0 18px -4px var(--w),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -6px 12px rgba(0,0,0,.28);transition:transform .12s,filter .15s,box-shadow .15s}
.bs .bt .trb:after{content:"";position:absolute;top:0;bottom:0;left:0;width:28%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.34),transparent);transform:translateX(-180%) skewX(-20deg);animation:bzSh 4s ease-in-out infinite}
.trb .tri{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:#06091c;background:radial-gradient(circle at 30% 25%,#fff,color-mix(in srgb,var(--w) 70%,#fff));box-shadow:0 0 10px var(--w);animation:trP 2.4s ease-in-out infinite}
.trb .trt{flex:1;min-width:0;text-shadow:0 0 8px var(--w)}
.trb .trg{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);transition:transform .15s,background .15s}
.bs .bt .trb:hover{filter:brightness(1.15);transform:translateY(-1px);box-shadow:0 0 26px -2px var(--w),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -6px 12px rgba(0,0,0,.28)}.trb:hover .trg{transform:translateX(3px);background:rgba(255,255,255,.3)}
.bs .bt .trb:active{transform:scale(.97)}
@keyframes trP{0%,100%{box-shadow:0 0 6px var(--w)}50%{box-shadow:0 0 16px 2px var(--w)}}
.bs .bq>.bk{--k:#ffe27a;display:flex!important;align-items:center;gap:8px;padding:6px 8px;border-radius:14px;background:linear-gradient(145deg,color-mix(in srgb,var(--k) 12%,rgba(0,0,0,.28)),rgba(0,0,0,.25));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) 38%,transparent)}
.bs .bq>.bk2{--k:#ff5d86}
.bk em{flex:none;width:28px;height:28px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:17px;color:var(--k);background:color-mix(in srgb,var(--k) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) 45%,transparent),0 0 10px -3px var(--k)}
.bk em .ic{filter:drop-shadow(0 0 3px var(--k))}
.bs .bq .bk i{color:var(--k);opacity:.9}
.bs .bq .bk b{font:900 17px/1.15 Orbitron,"Exo 2",system-ui,sans-serif;color:#fff;text-shadow:0 0 10px var(--k)}
@media (prefers-reduced-motion:reduce){.bs .bt .trb:after,.trb .tri{animation:none}}
#tp{position:absolute;left:50%;bottom:14px;translate:0 0;transform:translateX(-50%);z-index:3;display:none;align-items:center;gap:8px;padding:8px;border-radius:29px;background:linear-gradient(160deg,rgba(18,28,70,.9),rgba(7,11,30,.92));border:1px solid rgba(130,170,255,.38);box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 26px -4px rgba(0,229,255,.4),inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 22px rgba(123,92,255,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap;animation:tpIn .5s cubic-bezier(.2,1.3,.4,1) both}
#tp:before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(120deg,#00e5ff,#7b5cff,#ff3d8b,#00e5ff) 0/300% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.75;animation:tpB 6s linear infinite}
#tp.tb{left:auto;right:12px;transform:none}
@keyframes tpIn{from{opacity:0;translate:0 26px;scale:.92}to{opacity:1;translate:0 0;scale:1}}
@keyframes tpB{to{background-position:300% 0}}
@keyframes tcPop{0%{transform:scale(.6);opacity:.4}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
#tp button{--c:#00e5ff;position:relative;overflow:hidden;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--c) 85%,#fff);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 58%,#0a1030),color-mix(in srgb,var(--c) 16%,#0a1030));color:#fff;border-radius:20px;min-width:50px;height:50px;padding:0;cursor:pointer;touch-action:manipulation;box-shadow:0 0 16px -4px var(--c),inset 0 1px 0 rgba(255,255,255,.42),inset 0 -8px 14px rgba(0,0,0,.28);transition:transform .12s,filter .15s,box-shadow .15s}
#tp button:after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-200%) skewX(-20deg);animation:bzSh 4.5s ease-in-out infinite}
#tp button svg{width:22px;height:22px;flex:none;filter:drop-shadow(0 0 4px var(--c))}
#tp button:hover{filter:brightness(1.2);transform:translateY(-1px);box-shadow:0 0 24px -2px var(--c),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -8px 14px rgba(0,0,0,.28)}
#tp button:active{transform:scale(.86);filter:brightness(1.35)}
#tp button.pl{--c:#4dffb0}
#tp button.mi{--c:#ff5d86}
#tp button.tx{--c:#ff3d8b;display:flex;align-items:center;gap:8px;padding:0 16px 0 12px;font:900 12px/1 Orbitron,"Exo 2",system-ui,sans-serif;letter-spacing:1.4px;text-transform:uppercase;text-shadow:0 0 8px var(--c)}
#tp button.of{opacity:.3;filter:saturate(.25);pointer-events:none}
#tp .sp{align-self:stretch;width:1px;margin:4px 2px;background:linear-gradient(180deg,transparent,rgba(160,190,255,.5),transparent)}
#tp .tc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px;font:900 9px/1 "Space Grotesk","Exo 2",system-ui,sans-serif;color:#9aa6d8;letter-spacing:1.8px;text-transform:uppercase}
#tp .tc b{font:900 25px/1 Orbitron,"Exo 2",system-ui,sans-serif;letter-spacing:0;background:linear-gradient(180deg,#fff 10%,#ffe27a 60%,#ffb040);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px rgba(255,200,60,.5));animation:tcPop .3s cubic-bezier(.2,1.6,.4,1)}
#tp .tbar{display:block;width:100%;height:5px;border-radius:5px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 3px rgba(0,0,0,.7);overflow:hidden}
#tp .tbar:before{content:"";display:block;height:100%;width:var(--p);border-radius:5px;background:linear-gradient(90deg,#4dffb0,#ffe27a 60%,#ff5d86);box-shadow:0 0 8px rgba(77,255,176,.7);transition:width .25s}
@media (max-width:430px){#tp{gap:6px;padding:7px}#tp .tc{min-width:68px}#tp button.tx span{display:none}#tp button.tx{padding:0;min-width:50px}}
@media (prefers-reduced-motion:reduce){#tp,#tp:before,#tp button:after,#tp .tc b{animation:none}}
/* ---- Menú de armas (campo de entrenamiento) ---- */
#tw{position:absolute;right:10px;top:52px;z-index:4;display:none;touch-action:manipulation}
#tw button{padding:0;cursor:pointer;color:#8ff3ff;display:grid;place-items:center;touch-action:manipulation}
#tw .twt{position:relative;width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(130,170,255,.65);background:linear-gradient(160deg,rgba(24,36,86,.94),rgba(7,11,30,.96));box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 16px -3px rgba(0,229,255,.55),inset 0 1px 0 rgba(255,255,255,.24);transition:transform .12s,box-shadow .15s}
#tw .twt:hover{box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 22px -1px rgba(0,229,255,.8),inset 0 1px 0 rgba(255,255,255,.3)}
#tw .twt:active{transform:scale(.9)}
#tw .ic{width:22px;height:22px;filter:drop-shadow(0 0 4px rgba(0,229,255,.7))}
#tw .twt .cv{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:linear-gradient(145deg,#ff3d8b,#7b5cff);border:1.5px solid #0a1030;color:#fff;display:grid;place-items:center;box-shadow:0 0 8px rgba(255,61,139,.6)}
#tw .cv svg{width:10px;height:10px;transition:transform .2s}
#tw.open .cv svg{transform:rotate(180deg)}
#tw .twm{position:absolute;top:50px;right:0;display:grid;grid-template-columns:repeat(3,40px);gap:6px;padding:8px;border-radius:26px;background:linear-gradient(160deg,rgba(18,28,70,.94),rgba(7,11,30,.96));border:1px solid rgba(130,170,255,.4);box-shadow:0 12px 30px rgba(0,0,0,.6),0 0 24px -4px rgba(0,229,255,.4),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transform-origin:top right;opacity:0;scale:.55;translate:0 -8px;pointer-events:none;transition:opacity .14s,scale .2s cubic-bezier(.2,1.4,.4,1),translate .2s cubic-bezier(.2,1.4,.4,1)}
#tw.open .twm{opacity:1;scale:1;translate:0 0;pointer-events:auto}
#tw .twb{width:40px;height:40px;border-radius:17px;border:1.5px solid rgba(130,170,255,.35);background:linear-gradient(160deg,rgba(60,80,170,.4),rgba(10,16,48,.7));box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:transform .12s,filter .15s,border-color .15s,box-shadow .15s}
#tw .twb:hover{filter:brightness(1.3);border-color:#8ff3ff;transform:translateY(-1px)}
#tw .twb:active{transform:scale(.88)}
#tw .twb.on{color:#fff;border-color:#fff;background:linear-gradient(145deg,#ff3d8b,#7b5cff);box-shadow:0 0 14px rgba(255,61,139,.7),inset 0 1px 0 rgba(255,255,255,.45)}
#tw .twb.on .ic{filter:drop-shadow(0 0 5px #fff)}
@media (max-width:430px){#tw .twm{grid-template-columns:repeat(3,36px);gap:5px;padding:7px;border-radius:22px}#tw .twb{width:36px;height:36px;border-radius:14px}}

/* ---- Volume sliders ---- */
.vs{box-sizing:border-box;width:100%;margin:10px 0;padding:12px 14px 14px;border-radius:var(--r-row);background:linear-gradient(145deg,rgba(16,29,65,.92),rgba(12,17,42,.92));border:1px solid rgba(43,74,150,.82);--a:#00e5ff;--b:#7b5cff;text-align:left}
.vs.fx{--a:#ff3d8b;--b:#ffb040}
.vh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.vi{font-size:18px;width:24px;text-align:center;filter:drop-shadow(0 0 6px var(--a))}
.vh b{flex:1;font:900 13px "Space Grotesk","Exo 2",system-ui;letter-spacing:1px;text-transform:uppercase;color:#e8ecff}
